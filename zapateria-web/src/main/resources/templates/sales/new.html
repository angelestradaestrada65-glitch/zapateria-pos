<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Registrar venta')}"></head>

<body class="bg-slate-50 min-h-screen flex flex-col">
	<nav th:replace="~{fragments/navbar :: navbar}"></nav>

	<main class="flex-1 p-6 max-w-6xl mx-auto w-full">

		<h1 class="text-2xl font-bold text-slate-800 mb-4">Registrar venta</h1>

		<div th:replace="~{fragments/messages :: messages}"></div>

		<div id="sale-app" class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start" th:data-discount="${discount}"
			th:attr="data-success=${mensaje != null}">

			<!-- Izquierda: buscador de productos -->
			<section class="lg:col-span-2 bg-white rounded shadow p-4">

				<input id="product-search" type="search" autofocus autocomplete="off"
					placeholder="Buscar por modelo, marca, talla o color (ej: nike 7 negro)"
					class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-500">
				<p id="search-hint" class="text-xs text-slate-400 mt-2"></p>

				<p th:if="${#lists.isEmpty(availableDetails)}" class="text-sm text-slate-500 mt-3">
					No hay productos con stock.
				</p>

				<table class="w-full text-sm mt-3">
					<thead class="text-left text-slate-500 border-b">
						<tr>
							<th class="py-2">Producto</th>
							<th class="py-2">Talla</th>
							<th class="py-2">Color</th>
							<th class="py-2">Precio</th>
							<th class="py-2">Stock</th>
							<th class="py-2"></th>
						</tr>
					</thead>
					<tbody id="product-list">
						<tr th:each="detail : ${availableDetails}" class="border-b" th:data-id="${detail.id}"
							th:data-name="${detail.product.name}" th:data-brand="${detail.product.brand}"
							th:data-size="${detail.size}" th:data-color="${detail.color}"
							th:data-price="${detail.price}" th:data-stock="${detail.stock}">
							<td class="py-2">
								<span th:text="${detail.product.name}">Producto</span>
								<span class="text-xs text-slate-400" th:text="${detail.product.brand}">Marca</span>
							</td>
							<td class="py-2" th:text="${detail.size}">Talla</td>
							<td class="py-2" th:text="${detail.color}">Color</td>
							<td class="py-2"
								th:text="'$' + ${#numbers.formatDecimal(detail.price, 1, 'COMMA', 2, 'POINT')}">Precio
							</td>
							<td class="py-2" th:text="${detail.stock}">Stock</td>
							<td class="py-2 text-right">
								<button type="button" data-add
									class="bg-slate-800 text-white rounded px-3 py-1 hover:bg-slate-700">
									Agregar
								</button>
							</td>
						</tr>
					</tbody>
				</table>
			</section>

			<!-- Derecha: venta actual (queda fija en pantallas grandes) -->
			<form id="sale-form" th:action="@{/sales}" th:object="${saleForm}" method="post"
				class="bg-white rounded shadow p-4 space-y-4 lg:sticky lg:top-4">

				<h2 class="text-lg font-semibold text-slate-800">Venta actual</h2>

				<p id="cart-empty" class="text-sm text-slate-400">Todavía no agregaste productos.</p>
				<ul id="cart-list" class="divide-y text-sm"></ul>
				<div id="cart-hidden"></div>

				<div class="flex justify-between font-semibold text-slate-800 border-t pt-3">
					<span>Total</span>
					<span id="cart-total">$0.00</span>
				</div>
				<p class="text-xs text-slate-400" th:text="'Incluye $' + ${discount} + ' de rebaja por par'">Incluye
					rebaja</p>

				<div>
					<label class="block text-sm text-slate-600 mb-1">Cliente (opcional)</label>
					<select th:field="*{customerId}" class="w-full border border-slate-300 rounded px-3 py-2">
						<option value="">Sin cliente</option>
						<option th:each="customer : ${customers}" th:value="${customer.id}"
							th:text="${customer.name} + ' - ' + ${customer.phone}"></option>
					</select>
				</div>

				<div class="flex items-center gap-2">
					<input type="checkbox" th:field="*{credit}">
					<label class="text-sm text-slate-600">Venta fiada</label>
				</div>

				<div id="advance-box" hidden>
					<label class="block text-sm text-slate-600 mb-1">Anticipo</label>
					<input type="number" step="0.01" min="0" th:field="*{amountPaid}"
						class="w-full border border-slate-300 rounded px-3 py-2">
					<p id="cart-pending" class="text-xs text-amber-700 mt-1"></p>
				</div>

				<button type="submit" id="submit-btn" disabled
					class="w-full bg-slate-800 text-white rounded py-2 hover:bg-slate-700 disabled:opacity-50 disabled:cursor-not-allowed">
					Registrar venta
				</button>
			</form>

		</div>

	</main>

	<footer th:replace="~{fragments/footer :: footer}"></footer>

	<script th:src="@{/js/sales.js}"></script>
</body>

</html>
