<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Usuario')}"></head>

<body class="bg-slate-50 min-h-screen flex flex-col">
	<nav th:replace="~{fragments/navbar :: navbar}"></nav>

	<main class="flex-1 p-6 max-w-md mx-auto w-full">

		<h1 class="text-2xl font-bold text-slate-800 mb-4">
			<span th:if="${userId == null}">Nuevo usuario</span>
			<span th:if="${userId != null}">Editar usuario</span>
		</h1>

		<div th:replace="~{fragments/messages :: messages}"></div>

		<form th:action="${userId == null} ? @{/sysadmin/users} : @{/sysadmin/users/{id}(id=${userId})}"
			th:object="${userForm}" method="post" class="bg-white rounded shadow p-6 space-y-4">

			<div>
				<label class="block text-sm text-slate-600 mb-1">Nombre</label>
				<input type="text" th:field="*{name}" required class="w-full border border-slate-300 rounded px-3 py-2">
			</div>

			<div>
				<label class="block text-sm text-slate-600 mb-1">Email</label>
				<input type="email" th:field="*{email}" required
					class="w-full border border-slate-300 rounded px-3 py-2">
			</div>

			<div>
				<label class="block text-sm text-slate-600 mb-1">
					Contraseña
					<span th:if="${userId != null}" class="text-xs text-slate-400">(dejala vacía para no
						cambiarla)</span>
				</label>
				<input type="password" name="password" minlength="8" th:required="${userId == null}"
					autocomplete="new-password" class="w-full border border-slate-300 rounded px-3 py-2">
			</div>

			<div>
				<label class="block text-sm text-slate-600 mb-1">Rol</label>
				<select th:field="*{roleId}" class="w-full border border-slate-300 rounded px-3 py-2">
					<option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.name}"></option>
				</select>
			</div>

			<div th:if="${userId != null}" class="flex items-center gap-2">
				<input type="checkbox" th:field="*{active}" id="active">
				<label for="active" class="text-sm text-slate-600">Usuario activo</label>
			</div>

			<button type="submit" class="w-full bg-slate-800 text-white rounded py-2 hover:bg-slate-700">
				Guardar
			</button>

		</form>

	</main>

	<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>

</html>
