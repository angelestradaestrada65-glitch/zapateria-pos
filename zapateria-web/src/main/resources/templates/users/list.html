<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Usuarios')}"></head>

<body class="bg-slate-50 min-h-screen flex flex-col">
	<nav th:replace="~{fragments/navbar :: navbar}"></nav>

	<main class="flex-1 p-6 max-w-4xl mx-auto w-full">

		<div class="flex justify-between items-center mb-4">
			<h1 class="text-2xl font-bold text-slate-800">Usuarios</h1>
			<a th:href="@{/sysadmin/users/new}"
				class="bg-slate-800 text-white rounded px-4 py-2 text-sm hover:bg-slate-700">
				Nuevo usuario
			</a>
		</div>

		<div th:replace="~{fragments/messages :: messages}"></div>

		<table class="w-full text-sm bg-white rounded shadow">
			<thead class="bg-slate-800 text-white">
				<tr>
					<th class="p-2 text-left">Nombre</th>
					<th class="p-2 text-left">Email</th>
					<th class="p-2 text-left">Rol</th>
					<th class="p-2 text-left">Estado</th>
					<th class="p-2 text-left"></th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="user : ${users}" class="border-b">
					<td class="p-2" th:text="${user.name}">Nombre</td>
					<td class="p-2" th:text="${user.email}">Email</td>
					<td class="p-2" th:text="${user.role.name}">Rol</td>
					<td class="p-2">
						<span th:if="${user.active}"
							class="bg-green-100 text-green-700 rounded px-2 py-0.5 text-xs">Activo</span>
						<span th:unless="${user.active}"
							class="bg-slate-200 text-slate-600 rounded px-2 py-0.5 text-xs">Inactivo</span>
					</td>
					<td class="p-2">
						<a th:href="@{/sysadmin/users/{id}/edit(id=${user.id})}"
							class="text-slate-700 hover:underline">Editar</a>
					</td>
				</tr>
			</tbody>
		</table>

	</main>

	<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>

</html>
