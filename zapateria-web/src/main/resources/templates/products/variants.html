<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Variantes')}"></head>

<body class="bg-slate-50 min-h-screen flex flex-col">
	<nav th:replace="~{fragments/navbar :: navbar}"></nav>

	<main class="flex-1 p-6 max-w-3xl mx-auto w-full">


		<h1 class="text-2xl font-bold text-slate-800 mb-1" th:text="'Variantes de ' + ${product.name}">Variantes</h1>
		<p class="text-sm text-slate-500 mb-4" th:text="${product.brand}">Marca</p>

		<div th:replace="~{fragments/messages :: messages}"></div>


		<table class="w-full text-sm bg-white rounded shadow mb-6">
			<thead class="bg-slate-800 text-white">
				<tr>
					<th class="p-2 text-left">Talla</th>
					<th class="p-2 text-left">Color</th>
					<th class="p-2 text-left">Precio</th>
					<th class="p-2 text-left">Stock</th>
					<th class="p-2 text-left"></th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="variant : ${variants}" class="border-b">
					<td class="p-2" th:text="${variant.size}">Talla</td>
					<td class="p-2" th:text="${variant.color}">Color</td>
					<td class="p-2" th:text="${variant.price}">Precio</td>
					<td class="p-2" th:text="${variant.stock}">Stock</td>
					<td class="p-2">
						<form th:action="@{/admin/products/variants/{id}/delete(id=${variant.id})}" method="post">
							<input type="hidden" name="productId" th:value="${product.id}">
							<button type="submit" class="text-red-600 hover:underline">Borrar</button>
						</form>
					</td>
				</tr>
			</tbody>
		</table>

		<h2 class="text-lg font-semibold text-slate-800 mb-2">Agregar variante</h2>

		<form th:action="@{/admin/products/{id}/variants(id=${product.id})}" th:object="${variantForm}" method="post"
			class="bg-white rounded shadow p-4 flex gap-3 items-end flex-wrap">

			<div>
				<label class="block text-xs text-slate-600 mb-1">Talla</label>
				<input type="text" th:field="*{size}" required class="border border-slate-300 rounded px-2 py-1 w-20">
			</div>
			<div>
				<label class="block text-xs text-slate-600 mb-1">Color</label>
				<input type="text" th:field="*{color}" required class="border border-slate-300 rounded px-2 py-1 w-28">
			</div>
			<div>
				<label class="block text-xs text-slate-600 mb-1">Precio</label>
				<input type="number" step="0.01" th:field="*{price}" required
					class="border border-slate-300 rounded px-2 py-1 w-24">
			</div>
			<div>
				<label class="block text-xs text-slate-600 mb-1">Stock</label>
				<input type="number" th:field="*{stock}" required
					class="border border-slate-300 rounded px-2 py-1 w-20">
			</div>

			<button type="submit" class="bg-slate-800 text-white rounded px-4 py-2 text-sm hover:bg-slate-700">
				Agregar
			</button>

		</form>

	</main>

	<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>

</html>
