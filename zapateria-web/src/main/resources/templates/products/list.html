<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Productos')}"></head>

<body class="bg-slate-50 min-h-screen flex flex-col">
	<nav th:replace="~{fragments/navbar :: navbar}"></nav>

	<main class="flex-1 p-6 max-w-4xl mx-auto w-full">

		<div class="flex justify-between items-center mb-4">
			<h1 class="text-2xl font-bold text-slate-800">Productos</h1>

			<div th:replace="~{fragments/messages :: messages}"></div>

			<a th:href="@{/admin/products/new}"
				class="bg-slate-800 text-white rounded px-4 py-2 text-sm hover:bg-slate-700">
				Nuevo producto
			</a>
		</div>

		<table class="w-full text-sm bg-white rounded shadow">
			<thead class="bg-slate-800 text-white">
				<tr>
					<th class="p-2 text-left">Nombre</th>
					<th class="p-2 text-left">Marca</th>
					<th class="p-2 text-left">Categoría</th>
					<th class="p-2 text-left">Acciones</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="product : ${products}" class="border-b">
					<td class="p-2" th:text="${product.name}">Nombre</td>
					<td class="p-2" th:text="${product.brand}">Marca</td>
					<td class="p-2" th:text="${product.category.name}">Categoría</td>
					<td class="p-2 space-x-2">
						<a th:href="@{/admin/products/{id}/variants(id=${product.id})}"
							class="text-slate-700 hover:underline">Variantes</a>
						<a th:href="@{/admin/products/{id}/edit(id=${product.id})}"
							class="text-slate-700 hover:underline">Editar</a>
						<form th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post" class="inline">
							<button type="submit" class="text-red-600 hover:underline">Borrar</button>
						</form>
					</td>
				</tr>
			</tbody>
		</table>

	</main>

	<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>

</html>
