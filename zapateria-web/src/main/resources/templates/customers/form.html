<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Cliente')}"></head>

<body class="bg-slate-50 min-h-screen flex flex-col">
	<nav th:replace="~{fragments/navbar :: navbar}"></nav>

	<main class="flex-1 p-6 max-w-md mx-auto w-full">

		<h1 class="text-2xl font-bold text-slate-800 mb-4">
			<span th:if="${customerId == null}">Nuevo cliente</span>
			<span th:if="${customerId != null}">Editar cliente</span>
		</h1>

		<div th:replace="~{fragments/messages :: messages}"></div>

		<form th:action="${customerId == null} ? @{/customers} : @{/customers/{id}(id=${customerId})}"
			th:object="${customerForm}" method="post" class="bg-white rounded shadow p-6 space-y-4">

			<div>
				<label class="block text-sm text-slate-600 mb-1">Nombre</label>
				<input type="text" th:field="*{name}" required class="w-full border border-slate-300 rounded px-3 py-2">
				<p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-xs text-red-600 mt-1"></p>
			</div>

			<div>
				<label class="block text-sm text-slate-600 mb-1">Teléfono</label>
				<input type="text" th:field="*{phone}" required
					class="w-full border border-slate-300 rounded px-3 py-2">
				<p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-xs text-red-600 mt-1"></p>
			</div>

			<div class="flex items-center gap-2">
				<input type="checkbox" th:field="*{credit}" id="credit">
				<label for="credit" class="text-sm text-slate-600">Permitir fiado</label>
			</div>

			<button type="submit" class="w-full bg-slate-800 text-white rounded py-2 hover:bg-slate-700">
				Guardar
			</button>

		</form>

	</main>

	<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>

</html>
