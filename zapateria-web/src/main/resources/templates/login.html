<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Iniciar sesión')}"></head>



<body class="bg-slate-100 min-h-screen flex items-center justify-center">

	<!-- <body><nav th:replace="~{fragments/navbar :: navbar}"></nav> /-->
	
	<div class="bg-white shadow-md rounded-lg p-8 w-full max-w-sm">

		<div th:replace="~{fragments/messages :: messages}"></div>
		
		<h1 class="text-2xl font-bold text-slate-800 mb-6 text-center">Zapatería</h1>

		<p th:if="${param.error}" class="bg-red-100 text-red-700 text-sm rounded p-2 mb-4">
			Email o contraseña incorrecta
		</p>

		<form th:action="@{/login}" method="post" class="space-y-4">
			<div>
				<label class="block text-sm text-slate-600 mb-1">Email</label>
				<input type="text" name="username" required
					class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-500">
			</div>
			<div>
				<label class="block text-sm text-slate-600 mb-1">Contraseña</label>
				<input type="password" name="password" required
					class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-500">
			</div>
			<button type="submit" class="w-full bg-slate-800 text-white rounded py-2 hover:bg-slate-700 transition">
				Entrar
			</button>
		</form>
	</div>
	<!--<footer th:replace="~{fragments/footer :: footer}"></footer> /-->
</body>

</html>
