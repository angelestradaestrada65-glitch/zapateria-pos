<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
	<span th:fragment="badge(state)" th:switch="${state.name()}">
		<span th:case="'PAID'" class="bg-green-100 text-green-700 rounded px-2 py-0.5 text-xs">Pagada</span>
		<span th:case="'ON_CREDIT'" class="bg-amber-100 text-amber-700 rounded px-2 py-0.5 text-xs">Fiada</span>
		<span th:case="'SETTLED'" class="bg-blue-100 text-blue-700 rounded px-2 py-0.5 text-xs">Saldada</span>
		<span th:case="'CANCELLED'" class="bg-red-100 text-red-700 rounded px-2 py-0.5 text-xs">Cancelada</span>
	</span>
</body>

</html>
